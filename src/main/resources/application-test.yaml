spring:
  data:
    redis:
      repositories:
        enabled: false
  kafka:
    listener:
      auto-startup: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  datasource:
    url: jdbc:h2:mem:booking-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  liquibase:
    enabled: true
scheduling:
  enabled: false

management:
  tracing:
    enabled: false

logging:
  level:
    root: WARN
    by.javaguru.jdmik12.bookingservice: INFO
